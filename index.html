<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon 1 leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1d1f; --muted:#6b6b70; --paper:#ffffff; --line:#e4e4e8; --accent:#500778; --accent2:#c6b0d6; --bad:#b3261e; --good:#1b7a3d; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f2f2f4; --muted:#a5a5ad; --paper:#141416; --line:#2c2c31; --accent:#c79bef; --accent2:#4a2c66; --bad:#ff8a80; --good:#7bd88f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"DM Sans",system-ui,sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:32px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:12px; }
  h1 { font-size:clamp(28px,4vw,48px); margin:0; letter-spacing:-0.02em; }
  .meta { color:var(--muted); font-size:15px; }
  table { width:100%; border-collapse:collapse; margin-top:20px; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:14px 10px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:18px; }
  td.rank { font-size:28px; font-weight:700; width:56px; color:var(--accent); }
  td.team { font-weight:700; font-size:22px; white-space:nowrap; }
  td.total { width:34%; }
  .bar { position:relative; height:30px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar i { position:absolute; inset:0 auto 0 0; background:var(--accent); }
  .bar b { position:absolute; right:8px; top:3px; font-size:18px; }
  .num { text-align:right; }
  .err { color:var(--bad); font-size:13px; margin-top:4px; white-space:normal; font-weight:400; }
  .when { color:var(--muted); font-size:14px; white-space:nowrap; }
  .empty { padding:48px 0; color:var(--muted); font-size:20px; }
  .fresh { animation: flash 2s ease-out; }
  @keyframes flash { from { background: var(--accent2); } to { background: transparent; } }
  footer { margin-top:20px; color:var(--muted); font-size:14px; }
  @media (max-width: 700px) { .hide-sm { display:none; } td.total { width:auto; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Hackathon #1 · Sampling under a budget</h1>
    <div class="meta" id="meta">Loading…</div>
  </header>
  <div id="board"></div>
  <footer>Marks out of 100: mean price 15 · district mean 20 · share above a price 30 · 95% intervals 15 · pylint 20. Each team is re-graded a few minutes after it pushes to main.</footer>
</main>
<script>
const W = {mean_price:15, domain_mean:20, share_above:30, coverage:15, code_quality:20};
const COLS = [["mean_price","Mean"],["domain_mean","District"],["share_above","Share"],["coverage","Intervals"],["code_quality","pylint"]];
let last = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit", timeZone:"Europe/London"}) : "";
async function load() {
  // one file per grading runner (shard); merge them
  const parts = (await Promise.all([0, 1, 2, 3].map(i =>
    fetch(`leaderboard-${i}.json?t=${Date.now()}`, {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null)))).filter(Boolean);
  if (!parts.length) return;
  const d = {teams: {}, round: Math.max(...parts.map(p => p.round || 0)),
             updated: parts.map(p => p.updated || "").sort().pop(), final: parts.every(p => p.final)};
  parts.forEach(p => Object.assign(d.teams, p.teams || {}));
  const teams = Object.entries(d.teams || {}).sort((a, b) => b[1].total - a[1].total || a[0].localeCompare(b[0], undefined, {numeric:true}));
  document.getElementById("meta").textContent = (d.final ? "Final results" : "Round " + d.round) + (d.updated ? " · updated " + hm(d.updated) : "");
  if (!teams.length) { document.getElementById("board").innerHTML = '<p class="empty">No team has pushed yet.</p>'; return; }
  let html = '<table><thead><tr><th>#</th><th>Team</th><th>Total</th>' + COLS.map(([k, l]) => `<th class="num hide-sm">${l} <span style="opacity:.6">/${W[k]}</span></th>`).join("") + '<th class="hide-sm">Graded</th></tr></thead><tbody>';
  teams.forEach(([name, t], i) => {
    const fresh = last[name] && last[name] !== t.sha ? " fresh" : "";
    const m = t.marks || {};
    html += `<tr class="${fresh}"><td class="rank">${i + 1}</td><td class="team">${esc(name)}${(t.errors || []).length ? `<div class="err">${t.errors.map(esc).join("<br>")}</div>` : ""}</td>` +
      `<td class="total"><div class="bar"><i style="width:${Math.max(0, Math.min(100, t.total))}%"></i><b>${(t.total ?? 0).toFixed(1)}</b></div></td>` +
      COLS.map(([k]) => `<td class="num hide-sm">${m[k] == null ? "–" : m[k].toFixed(1)}</td>`).join("") +
      `<td class="when hide-sm">${t.final ? "<b>final</b> · " : ""}${hm(t.graded)}<br>${esc((t.sha || "").slice(0, 7))}</td></tr>`;
  });
  document.getElementById("board").innerHTML = html + "</tbody></table>";
  last = Object.fromEntries(teams.map(([n, t]) => [n, t.sha]));
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
